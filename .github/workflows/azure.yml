name: Azure CI/CD

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }} # like myregistry.azurecr.io
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - run: npx prisma generate
      - run: npm run build
      - name: Debug build errors if any
        run: npm run build || true

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_LOGIN_SERVER }}

      - name: Build and push image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/finance-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Get AKS credentials
        run: az aks get-credentials -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" --overwrite-existing
      - name: Kustomize render and apply
        run: |
          sed -i "s#REPLACE_WITH_ACR#${{ env.ACR_LOGIN_SERVER }}#g" k8s/overlays/azure/kustomization.yaml
          kubectl apply -k k8s/overlays/azure

  set-secrets-and-restart:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Get AKS credentials
        run: az aks get-credentials -g "$AKS_RESOURCE_GROUP" -n "$AKS_CLUSTER_NAME" --overwrite-existing
      - name: Get external IP
        id: ip
        run: echo "ip=$(kubectl get svc azure-finance-app -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" >> $GITHUB_OUTPUT
      - name: Update secret and restart
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          IP: ${{ steps.ip.outputs.ip }}
        run: |
          kubectl delete secret azure-finance-secrets || true
          kubectl create secret generic azure-finance-secrets \
            --from-literal=DATABASE_URL="${DB_URL}" \
            --from-literal=API_TOKEN="${API_TOKEN:-change-me}" \
            --from-literal=CORS_ORIGIN="http://${IP}" \
            --from-literal=NEXTAUTH_SECRET="${NEXTAUTH_SECRET:-$(openssl rand -hex 32)}" \
            --from-literal=NEXTAUTH_URL="http://${IP}"
          kubectl rollout restart deployment azure-finance-app



