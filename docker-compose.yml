version: '3.9'
services:
  db:
    image: postgres:16-alpine
    container_name: finance-db
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: finance-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/finance?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: sh -c "npx prisma migrate deploy && npm run start"
volumes:
  db_data:



