apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finance-app
  template:
    metadata:
      labels:
        app: finance-app
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: app
          image: ghcr.io/your-user/finance-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: DATABASE_URL
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: API_TOKEN
            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: CORS_ORIGIN
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: finance-secrets
                  key: NEXTAUTH_URL



